<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Helper</title>
    <!-- 靜態載入頁面載入器樣式（避免 FOUC） -->
    <link rel="stylesheet" href="/css/components/page-loader.css">
    <!-- 其他 CSS 將動態載入 -->
</head>

<body class="page-wrapper">
    <!-- 頁面載入器 -->
    <div id="pageLoader" class="page-loader-overlay">
        <div class="page-loader-content">
            <div class="page-loader-spinner"></div>
            <div class="page-loader-text">載入中...</div>
        </div>
    </div>

    <!-- 頁面內容容器 -->
    <div id="pageContent" class="page-content">

        <!-- 頂部導航欄 -->
        <nav class="navbar admin-navbar">
            <div class="navbar-brand">
                <i class="fa-solid fa-comments mr-sm"></i>
                <span>E-Helper</span>
            </div>
            <div class="navbar-info">
                <span id="userInfo" class="user-info" onclick="UserMenu.openUserMenu()">
                    <i class="fas fa-user-circle"></i>
                    <span id="username">載入中...</span>
                    <span id="userRole" class="user-role"></span>
                </span>
            </div>
        </nav>

        <!-- 個人功能抽屜 -->
        <div id="userMenuDrawer" onclick="UserMenu.closeUserMenu()" class="user-menu-drawer">
            <div class="user-menu-header">
                <span id="userMenuUsername"></span>
            </div>
            <div class="user-menu-content">
                <button onclick="UserMenu.showChangePasswordModal()" class="menu-item">
                    <i class="fa-solid fa-key"></i>
                    <span>變更密碼</span>
                </button>
                <hr>
                <button onclick="UserMenu.logout()" class="menu-item">
                    <i class="fa-solid fa-sign-out-alt"></i>
                    <span>登出</span>
                </button>
            </div>
        </div>

        <!-- 變更密碼模態框 -->
        <div id="changePasswordModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>變更密碼</h3>
                    <button class="modal-close" onclick="UserMenu.closeChangePasswordModal()">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="oldPassword" class="form-label">舊密碼</label>
                        <input type="password" id="oldPassword" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword" class="form-label">新密碼</label>
                        <input type="password" id="newPassword" class="form-control" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword" class="form-label">確認新密碼</label>
                        <input type="password" id="confirmNewPassword" class="form-control" required minlength="6">
                    </div>
                </div>
                <div class="modal-footer">
                    <button onclick="UserMenu.closeChangePasswordModal()" class="btn btn-secondary">取消</button>
                    <button onclick="UserMenu.changePassword()" class="btn btn-primary">確認變更</button>
                </div>
            </div>
        </div>

        <div id="qaTab" class="tab-content active">

            <div class="dashboard-layout">

                <!-- 左側抽屜容器 -->
                <div id="drawerContainer" class="drawer-closed">
                    <!-- 抽屜頂端按鈕 -->
                    <div id="drawerToggleButtons">
                        <button title="對話記憶" class="drawer-toggle-btn" onclick="QAModule.showDrawerContent('memoryDrawer','user')"><i class="fa-solid fa-folder"></i></button>
                    </div>

                    <!-- 抽屜內容 -->
                    <div id="drawerContent">
                        <HR>
                        <!-- 對話記憶區 -->
                        <div id="memoryDrawer" class="drawer-panel">
                            <button title="新增對話" class="drawer-toggle-btn" onclick="QAModule.createNewConversation()"><i class="fas fa-solid fa-plus"></i></button>
                            <ul id="conversationList" class="conversation-list scrollable-fade"></ul>
                        </div>
                    </div>
                </div>

                <!-- 右側：問答區 -->
                <div id="qaContent" class="dashboard-content">
                    <div class="qa-layout">
                        <!-- 知識庫選擇區 -->
                        <div class="qa-header">
                            <i class="fa-solid fa-database text-success mr-sm icon-lg"></i>
                            <div class="flex-1">
                                <select id="qaKnowledgeBaseSelect" class="form-control">
                                    <option value="">載入中...</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex align-start p-xs">
                            <div id="nounAnalysis" aria-live="polite" aria-atomic="true" class="flex-1 scrollable-fade">已關閉名詞分析</div>
                        </div>
                        <div id="thinkToggleSection" class="d-none align-start p-xs">
                            <div id="thinkResponse" aria-live="polite" aria-atomic="true" class="flex-1 scrollable-fade">已關閉推理</div>
                        </div>
                        <div id="answer" aria-live="polite" aria-atomic="true" class="qa-content scrollable-fade">
                        </div>
                    </div>
                    <div class="qa-input">
                        <textarea id="question" rows="3" placeholder="請輸入問題..." aria-required="true" class="form-control mb-sm"></textarea>
                        <button type="button" id="sendBtn" class="btn btn-primary">送出問題</button>
                    </div>
                </div>
            </div>
        </div>

    </div> <!-- 結束 pageContent -->

    <!-- 模組化載入器 -->
    <script>
        // 內嵌簡單的載入函數，避免快取問題
        function loadWithTimestamp(src) {
            const script = document.createElement('script');
            script.src = `${src}?_t=${Date.now()}`;
            return new Promise((resolve, reject) => {
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        // 全域函數 - 為了保持向後相容
        function switchTab(tabId) {
            document.querySelectorAll('.tablink').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelector(`[onclick*="${tabId}"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');

            // 呼叫 QAModule 的檢查功能
            if (typeof QAModule !== 'undefined' && QAModule.checkThinkFeature) {
                QAModule.checkThinkFeature();
            }
        }

        // 依序載入模組
        (async function () {
            try {
                // 先載入 ResourceLoader
                await loadWithTimestamp('/js/modules/resource-loader.js');

                // 動態載入所有 CSS
                await ResourceLoader.loadStyles([
                    '/css/components/dialog.css',
                    '/css/core/all.min.css',
                    '/css/core/base.css',
                    '/css/core/components.css',
                    '/css/core/layouts.css',
                    '/css/core/utilities.css',
                    '/css/themes/theme-variables.css',
                    '/css/pages/dashboard.css'
                ]);

                // 隱藏頁面載入器，顯示內容
                document.getElementById('pageLoader').classList.add('hidden');
                document.getElementById('pageContent').classList.add('visible');

                // 使用 ResourceLoader 載入其他模組
                await ResourceLoader.loadModulesInOrder([
                    '/js/components/dialog.js',
                    '/js/modules/common-ui.js',
                    '/js/modules/permission-checker.js',
                    '/js/modules/qa-module.js',
                    '/js/modules/style-manager.js',
                    '/js/modules/theme-manager.js',
                    '/js/modules/user-menu-module.js',
                    '/js/lib/marked.min.js',
                ]);

                // 初始化模組
                CommonUI.hideSpinner();
                
                // 先初始化權限檢查器
                if (window.PermissionChecker) {
                    await PermissionChecker.init();
                }
                
                UserMenu.init();
                QAModule.init();

                // 初始化滾動條淡出淡入效果
                if (CommonUI.initScrollFadeEffect) {
                    CommonUI.initScrollFadeEffect();
                }

                console.log('所有模組載入完成');
            } catch (error) {
                console.error('模組載入失敗:', error);
            }
        })();
    </script>
</body>

</html>
