<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - E-Helper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 新的 CSS 架構 -->
    <link rel="stylesheet" href="css/themes/theme-variables.css">
    <link rel="stylesheet" href="css/core/base.css">
    <link rel="stylesheet" href="css/core/components.css">
    <link rel="stylesheet" href="css/core/utilities.css">
    <link rel="stylesheet" href="css/core/layouts.css">
    <!-- 頁面專用樣式 -->
    <link rel="stylesheet" href="css/register.css">
</head>

<body class="auth-layout">
    <div class="auth-container">
        <div class="auth-header">
            <h1><i class="fas fa-user-plus"></i> 註冊帳號</h1>
            <p>建立您的帳號以開始使用</p>
        </div>

        <div id="error-message" class="alert alert-danger d-none"></div>
        <div id="success-message" class="alert alert-success d-none"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="username">用戶名</label>
                <input type="text" id="username" name="username" class="form-control" required minlength="3" maxlength="20">
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" class="form-control" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">確認密碼</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">註冊</button>
        </form>

        <div class="login-link">
            <p>已有帳號？ <a href="/login">立即登入</a></p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            // 驗證密碼
            if (password !== confirmPassword) {
                showError('密碼與確認密碼不符');
                return;
            }

            try {
                const response = await fetch('/api/user/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('註冊成功！正在跳轉...');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showError(data.detail || '註冊失敗');
                }
            } catch (error) {
                showError('網路錯誤，請稍後再試');
            }
        });

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            errorDiv.textContent = message;
            errorDiv.classList.remove('d-none');
            successDiv.classList.add('d-none');
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.classList.remove('d-none');
            errorDiv.classList.add('d-none');
        }
    </script>
    
    <!-- 載入新的管理器 -->
    <script src="/js/modules/theme-manager.js"></script>
    <script src="/js/modules/style-manager.js"></script>
</body>

</html>
