<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <title>Index Summary</title>
    <script src="js/lib/marked.min.js"></script>
    <link rel="stylesheet" href="css/components/showindex.css">
</head>

<body>
    <h1>Index Summary</h1>
    <div class="status" id="status">載入中...</div>
    <div id="content"></div>

    <script>
        function getQueryParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }
        async function loadSummary() {
            const status = document.getElementById('status');
            const content = document.getElementById('content');
            const kb_id = getQueryParam('kb_id');
            try {
                // 加入時間戳破壞快取
                const timestamp = new Date().getTime();
                const response = await fetch(`/api/vector/index/summary/all?kb_id=${kb_id}&_t=${timestamp}`);
                if (!response.ok) throw new Error('API 載入失敗');

                const data = await response.json();

                status.textContent = `總共 ${data.count} 筆資料，索引存在：${data.index_exists ? '是' : '否'}`;

                data.chunks.forEach(chunk => {
                    const div = document.createElement('div');
                    div.className = 'markdown-block';
                    div.innerHTML = marked.parse(chunk);
                    content.appendChild(div);
                });
            } catch (error) {
                status.textContent = '錯誤：' + error.message;
            }
        }

        window.onload = loadSummary;
    </script>
</body>

</html>
