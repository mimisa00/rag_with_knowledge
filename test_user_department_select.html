<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用者部門選擇器測試</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="frontend/static/css/core/all.min.css">
    <link rel="stylesheet" href="frontend/static/css/themes/theme-variables.css">
    <link rel="stylesheet" href="frontend/static/css/core/base.css">
    <link rel="stylesheet" href="frontend/static/css/core/components.css">
    <link rel="stylesheet" href="frontend/static/css/components/searchable-select.css">
    
    <style>
        body {
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .col-6 {
            grid-column: span 1;
        }
        fieldset {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }
        legend {
            padding: 0 10px;
            font-weight: 600;
        }
        .test-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .test-modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        .btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-primary {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a67d8;
        }
        .required {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>使用者帳號管理 - 部門選擇器測試</h1>
        
        <div class="form-group">
            <button class="btn btn-primary" onclick="testAddUser()">測試新增使用者</button>
            <button class="btn btn-primary" onclick="testEditUser()">測試編輯使用者</button>
            <button class="btn" onclick="getValues()">獲取選中值</button>
        </div>
        
        <div id="result" style="margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 4px; display: none;"></div>
    </div>
    
    <!-- 使用者模態框 -->
    <div id="userModal" class="test-modal modal">
        <div class="modal-content">
            <button class="modal-close" onclick="hideModal()">&times;</button>
            <h3 id="userModalTitle">新增使用者</h3>
            
            <form id="userForm">
                <input type="hidden" name="id" id="userId">
                
                <!-- 基本資訊 -->
                <fieldset>
                    <legend>基本資訊</legend>
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label class="form-label">帳號 <span class="required">*</span></label>
                            <input type="text" class="form-control" name="loginid" id="userLoginid" required>
                        </div>
                        <div class="form-group col-6">
                            <label class="form-label">姓名 <span class="required">*</span></label>
                            <input type="text" class="form-control" name="username" id="userUsername" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label class="form-label">Email <span class="required">*</span></label>
                            <input type="email" class="form-control" name="email" id="userEmail" required>
                        </div>
                        <div class="form-group col-6">
                            <label class="form-label">員工編號</label>
                            <input type="text" class="form-control" name="employee_no" id="userEmployeeNo">
                        </div>
                    </div>
                </fieldset>
                
                <!-- 組織資訊 -->
                <fieldset>
                    <legend>組織資訊</legend>
                    <div class="form-row">
                        <div class="form-group col-6">
                            <label class="form-label">部門 <span class="required">*</span></label>
                            <select class="form-control searchable-select" name="department_id" id="userDepartment" required
                                    data-placeholder="請選擇部門..." 
                                    data-search-placeholder="搜尋部門名稱..." 
                                    data-no-results="找不到符合的部門">
                                <option value="">請選擇部門</option>
                                <option value="1">總經理室</option>
                                <option value="2">技術部</option>
                                <option value="3">前端組</option>
                                <option value="4">後端組</option>
                                <option value="5">業務部</option>
                                <option value="6">人資部</option>
                                <option value="7">財務部</option>
                                <option value="8">行銷部</option>
                                <option value="9">客服部</option>
                                <option value="10">研發部</option>
                                <option value="11">設計部</option>
                                <option value="12">品管部</option>
                                <option value="13">採購部</option>
                                <option value="14">法務部</option>
                                <option value="15">公關部</option>
                                <option value="16">企劃部</option>
                                <option value="17">稽核部</option>
                                <option value="18">總務部</option>
                                <option value="19">資訊部</option>
                                <option value="20">安全部</option>
                            </select>
                        </div>
                        <div class="form-group col-6">
                            <label class="form-label">職稱</label>
                            <input type="text" class="form-control" name="title" id="userTitle">
                        </div>
                    </div>
                </fieldset>
                
                <div class="form-group">
                    <button type="button" class="btn btn-primary" onclick="saveUser()">儲存</button>
                    <button type="button" class="btn" onclick="hideModal()">取消</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="frontend/static/js/components/searchable-select.js"></script>
    
    <script>
        // 模擬使用者資料
        const mockUsers = [
            {
                id: 1,
                loginid: 'john_doe',
                username: 'John Doe',
                email: 'john@example.com',
                employee_no: 'EMP001',
                department: { id: 2, name: '技術部' },
                title: '資深工程師'
            },
            {
                id: 2,
                loginid: 'jane_smith',
                username: 'Jane Smith',
                email: 'jane@example.com',
                employee_no: 'EMP002',
                department: { id: 6, name: '人資部' },
                title: '人資專員'
            }
        ];
        
        function testAddUser() {
            // 重置表單
            document.getElementById('userForm').reset();
            document.getElementById('userId').value = '';
            
            // 設定標題
            document.getElementById('userModalTitle').textContent = '新增使用者';
            
            // 啟用帳號欄位
            document.getElementById('userLoginid').disabled = false;
            
            // 初始化 SearchableSelect
            initUserDepartmentSelect();
            
            // 顯示模態框
            document.getElementById('userModal').classList.add('show');
        }
        
        function testEditUser() {
            // 使用模擬資料填充表單
            const user = mockUsers[0]; // 使用第一個使用者
            
            document.getElementById('userId').value = user.id;
            document.getElementById('userLoginid').value = user.loginid;
            document.getElementById('userUsername').value = user.username;
            document.getElementById('userEmail').value = user.email;
            document.getElementById('userEmployeeNo').value = user.employee_no;
            document.getElementById('userTitle').value = user.title;
            
            // 設定標題
            document.getElementById('userModalTitle').textContent = '編輯使用者';
            
            // 禁用帳號欄位
            document.getElementById('userLoginid').disabled = true;
            
            // 初始化 SearchableSelect
            initUserDepartmentSelect();
            
            // 設定部門值
            setTimeout(() => {
                const deptSelect = document.getElementById('userDepartment');
                const deptId = user.department.id.toString();
                deptSelect.value = deptId;
                
                if (deptSelect.searchableSelectInstance) {
                    deptSelect.searchableSelectInstance.setValue(deptId);
                }
            }, 100);
            
            // 顯示模態框
            document.getElementById('userModal').classList.add('show');
        }
        
        function initUserDepartmentSelect() {
            const deptSelect = document.getElementById('userDepartment');
            
            if (deptSelect && !deptSelect.searchableSelectInstance && window.SearchableSelect) {
                const searchableOptions = {
                    placeholder: deptSelect.dataset.placeholder || '請選擇部門...',
                    searchPlaceholder: deptSelect.dataset.searchPlaceholder || '搜尋部門名稱...',
                    noResultsText: deptSelect.dataset.noResults || '找不到符合的部門',
                    maxHeight: '200px'
                };
                
                const instance = new SearchableSelect(deptSelect, searchableOptions);
                deptSelect.searchableSelectInstance = instance;
            } else if (deptSelect.searchableSelectInstance) {
                deptSelect.searchableSelectInstance.reload();
            }
        }
        
        function hideModal() {
            document.getElementById('userModal').classList.remove('show');
            
            // 重置表單和 SearchableSelect
            const form = document.getElementById('userForm');
            form.reset();
            
            const deptSelect = document.getElementById('userDepartment');
            if (deptSelect.searchableSelectInstance) {
                deptSelect.searchableSelectInstance.updateDisplay();
            }
        }
        
        function saveUser() {
            const form = document.getElementById('userForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            console.log('儲存使用者資料:', data);
            alert('使用者資料已儲存（模擬）\n' + JSON.stringify(data, null, 2));
            hideModal();
        }
        
        function getValues() {
            const deptValue = document.getElementById('userDepartment').value;
            const deptSelect = document.getElementById('userDepartment');
            const selectedText = deptSelect.searchableSelectInstance ? 
                deptSelect.searchableSelectInstance.getSelectedText() : 
                deptSelect.options[deptSelect.selectedIndex]?.text || '';
            
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.innerHTML = `
                <h4>當前選中值：</h4>
                <p><strong>部門 ID：</strong> ${deptValue || '未選擇'}</p>
                <p><strong>部門名稱：</strong> ${selectedText || '未選擇'}</p>
            `;
        }
        
        // 點擊模態框外部關閉
        document.getElementById('userModal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideModal();
            }
        });
        
        // 監聽選擇變化
        document.addEventListener('change', function(e) {
            if (e.target.id === 'userDepartment') {
                console.log('部門選擇改變:', e.target.value);
            }
        });
    </script>
</body>
</html>
