<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色類型更新測試</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; color: #0c5460; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .role-item { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 3px; }
        select, input { margin: 5px; padding: 5px; }
    </style>
</head>
<body>
    <h1>角色類型更新測試</h1>
    
    <div class="test-section info">
        <h2>測試說明</h2>
        <p>本頁面用於測試角色編輯時類型（自訂/系統）切換功能是否正常運作。</p>
        <p>測試步驟：1. 載入現有角色 → 2. 選擇要測試的角色 → 3. 更改類型 → 4. 提交更新 → 5. 驗證結果</p>
    </div>

    <div class="test-section">
        <h2>步驟 1: 載入角色列表</h2>
        <button onclick="loadRoles()">載入角色</button>
        <div id="rolesList"></div>
    </div>

    <div class="test-section">
        <h2>步驟 2: 選擇並編輯角色</h2>
        <div id="editSection" style="display: none;">
            <div>
                <label>角色 ID: </label>
                <input type="number" id="roleId" readonly>
            </div>
            <div>
                <label>角色名稱: </label>
                <input type="text" id="roleName">
            </div>
            <div>
                <label>角色類型: </label>
                <select id="roleType">
                    <option value="custom">自訂</option>
                    <option value="system">系統</option>
                </select>
            </div>
            <div>
                <label>描述: </label>
                <textarea id="roleDescription" rows="3" cols="50"></textarea>
            </div>
            <div>
                <label>狀態: </label>
                <select id="roleActive">
                    <option value="true">啟用</option>
                    <option value="false">停用</option>
                </select>
            </div>
            <div>
                <button onclick="updateRole()">更新角色</button>
                <button onclick="clearEdit()">清除</button>
            </div>
        </div>
    </div>

    <div class="test-section">
        <h2>步驟 3: 測試結果</h2>
        <div id="testResults"></div>
    </div>

    <script>
        let roles = [];

        async function loadRoles() {
            try {
                const response = await fetch('/api/organization/roles', {
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                roles = await response.json();
                displayRoles();
                showMessage('角色列表載入成功', 'success');
            } catch (error) {
                console.error('載入角色失敗:', error);
                showMessage('載入角色失敗: ' + error.message, 'error');
            }
        }

        function displayRoles() {
            const container = document.getElementById('rolesList');
            if (roles.length === 0) {
                container.innerHTML = '<p>沒有找到角色資料</p>';
                return;
            }

            container.innerHTML = roles.map(role => `
                <div class="role-item">
                    <strong>ID: ${role.id}</strong> - 
                    <strong>${role.name}</strong> 
                    (${role.code}) - 
                    類型: <strong>${role.role_type === 'system' ? '系統' : '自訂'}</strong> - 
                    狀態: ${role.is_active ? '啟用' : '停用'}
                    <br>
                    <small>描述: ${role.description || '無'}</small>
                    <br>
                    <button onclick="editRole(${role.id})">編輯此角色</button>
                </div>
            `).join('');
        }

        function editRole(roleId) {
            const role = roles.find(r => r.id === roleId);
            if (!role) {
                showMessage('找不到指定的角色', 'error');
                return;
            }

            // 填入表單
            document.getElementById('roleId').value = role.id;
            document.getElementById('roleName').value = role.name;
            document.getElementById('roleType').value = role.role_type || 'custom';
            document.getElementById('roleDescription').value = role.description || '';
            document.getElementById('roleActive').value = role.is_active ? 'true' : 'false';

            // 顯示編輯區
            document.getElementById('editSection').style.display = 'block';
            showMessage(`開始編輯角色: ${role.name}`, 'info');
        }

        async function updateRole() {
            const roleId = document.getElementById('roleId').value;
            const roleName = document.getElementById('roleName').value;
            const roleType = document.getElementById('roleType').value;
            const roleDescription = document.getElementById('roleDescription').value;
            const roleActive = document.getElementById('roleActive').value === 'true';

            if (!roleId || !roleName) {
                showMessage('請填寫必要欄位', 'error');
                return;
            }

            const updateData = {
                name: roleName,
                role_type: roleType,
                description: roleDescription,
                is_active: roleActive
            };

            try {
                const response = await fetch(`/api/organization/roles/${roleId}`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => null);
                    throw new Error(errorData?.detail || `HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                showMessage('角色更新成功！', 'success');
                
                // 重新載入角色列表以確認更新
                await loadRoles();
                clearEdit();

            } catch (error) {
                console.error('更新角色失敗:', error);
                showMessage('更新角色失敗: ' + error.message, 'error');
            }
        }

        function clearEdit() {
            document.getElementById('editSection').style.display = 'none';
            document.getElementById('roleId').value = '';
            document.getElementById('roleName').value = '';
            document.getElementById('roleType').value = 'custom';
            document.getElementById('roleDescription').value = '';
            document.getElementById('roleActive').value = 'true';
        }

        function showMessage(message, type = 'info') {
            const container = document.getElementById('testResults');
            const messageDiv = document.createElement('div');
            messageDiv.className = `test-section ${type}`;
            messageDiv.innerHTML = `<p><strong>${new Date().toLocaleTimeString()}</strong>: ${message}</p>`;
            container.appendChild(messageDiv);
            
            // 滾動到最新訊息
            messageDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // 頁面載入時自動載入角色
        window.addEventListener('load', () => {
            showMessage('測試頁面已載入', 'info');
        });
    </script>
</body>
</html>
