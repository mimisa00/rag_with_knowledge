<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部門樹狀結構除錯</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #569cd6;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #2d2d30;
            border-radius: 5px;
        }
        .section h2 {
            color: #4ec9b0;
            margin-top: 0;
        }
        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
            border: 1px solid #464647;
        }
        .tree-node {
            margin: 5px 0;
            padding: 5px;
            background: #252526;
            border-left: 3px solid #007acc;
        }
        .child-node {
            margin-left: 30px;
            border-left-color: #608b4e;
        }
        .error {
            color: #f48771;
            background: #3a1e1e;
            padding: 10px;
            border-radius: 3px;
            margin: 10px 0;
        }
        .success {
            color: #4ec9b0;
            background: #1e3a2e;
            padding: 10px;
            border-radius: 3px;
            margin: 10px 0;
        }
        .highlight {
            background: #515151;
            padding: 2px 5px;
            border-radius: 3px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1177bb;
        }
        .comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .comparison > div {
            padding: 10px;
            background: #1e1e1e;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐛 部門樹狀結構除錯工具</h1>
        
        <div class="section">
            <h2>控制面板</h2>
            <button onclick="testDatabaseData()">測試資料庫資料</button>
            <button onclick="testBuildTree()">測試 buildTree 函數</button>
            <button onclick="testDataTypes()">測試資料類型</button>
            <button onclick="testFullFlow()">完整流程測試</button>
        </div>

        <div class="section">
            <h2>資料庫原始資料</h2>
            <pre id="dbData"></pre>
        </div>

        <div class="section">
            <h2>資料類型分析</h2>
            <pre id="typeAnalysis"></pre>
        </div>

        <div class="section">
            <h2>樹狀結構建構過程</h2>
            <pre id="treeProcess"></pre>
        </div>

        <div class="section">
            <h2>最終樹狀結構</h2>
            <div id="finalTree"></div>
        </div>

        <div class="section">
            <h2>問題診斷</h2>
            <div id="diagnosis"></div>
        </div>
    </div>

    <script>
        // 模擬資料庫資料
        const dbData = [
            { id: 1, name: '預設部門', code: 'DEFAULT', parent_id: null, is_active: 0 },
            { id: 2, name: '研發部', code: 'RD', parent_id: null, is_active: 1 },
            { id: 3, name: 'DEP_TEST_ROOT', code: 'DEP_TEST_ROOT', parent_id: null, is_active: 1 },
            { id: 6, name: '資訊技術部', code: 'IT', parent_id: null, is_active: 1 },
            { id: 4, name: 'DEP_TEST', code: 'DEP_TEST', parent_id: 3, is_active: 1 }
        ];

        function log(elementId, content, isHtml = false) {
            const element = document.getElementById(elementId);
            if (isHtml) {
                element.innerHTML += content + '\n';
            } else {
                element.textContent += content + '\n';
            }
        }

        function clearAll() {
            ['dbData', 'typeAnalysis', 'treeProcess', 'finalTree', 'diagnosis'].forEach(id => {
                document.getElementById(id).innerHTML = '';
            });
        }

        function testDatabaseData() {
            clearAll();
            log('dbData', '// 資料庫原始資料');
            log('dbData', JSON.stringify(dbData, null, 2));
            
            // 分析 parent_id 的值
            const parentIds = dbData.map(d => ({
                id: d.id,
                name: d.name,
                parent_id: d.parent_id,
                parent_id_type: typeof d.parent_id,
                is_null: d.parent_id === null,
                is_undefined: d.parent_id === undefined,
                is_zero: d.parent_id === 0,
                is_string: typeof d.parent_id === 'string'
            }));
            
            log('typeAnalysis', '// parent_id 資料類型分析');
            log('typeAnalysis', JSON.stringify(parentIds, null, 2));
        }

        function buildTree(items, parentId = null) {
            log('treeProcess', `\n// 呼叫 buildTree(items, parentId=${JSON.stringify(parentId)})`);
            
            const filtered = items.filter(item => {
                const match = item.parent_id === parentId;
                log('treeProcess', `  檢查 ${item.name}: parent_id(${JSON.stringify(item.parent_id)}) === parentId(${JSON.stringify(parentId)}) = ${match}`);
                return match;
            });
            
            log('treeProcess', `  找到 ${filtered.length} 個符合的項目`);
            
            return filtered.map(item => ({
                ...item,
                children: buildTree(items, item.id)
            }));
        }

        function testBuildTree() {
            clearAll();
            log('treeProcess', '// 測試 buildTree 函數');
            const tree = buildTree(dbData);
            
            log('finalTree', '<h3>建構結果：</h3>', true);
            renderTree(tree, 'finalTree');
            
            // 診斷
            const diagnosis = [];
            
            // 檢查是否有孤立節點
            const rootNodes = dbData.filter(d => d.parent_id === null);
            const childNodes = dbData.filter(d => d.parent_id !== null);
            
            diagnosis.push(`<div class="success">找到 ${rootNodes.length} 個根節點</div>`);
            diagnosis.push(`<div class="success">找到 ${childNodes.length} 個子節點</div>`);
            
            // 檢查 DEP_TEST 是否正確連接
            const depTest = dbData.find(d => d.name === 'DEP_TEST');
            const depTestRoot = dbData.find(d => d.id === depTest.parent_id);
            
            if (depTestRoot) {
                diagnosis.push(`<div class="success">DEP_TEST 的父節點是 ${depTestRoot.name} (id=${depTestRoot.id})</div>`);
            } else {
                diagnosis.push(`<div class="error">找不到 DEP_TEST 的父節點 (parent_id=${depTest.parent_id})</div>`);
            }
            
            log('diagnosis', diagnosis.join(''), true);
        }

        function testDataTypes() {
            clearAll();
            
            // 測試不同的比較方式
            const testCases = [
                { a: null, b: null, op: '===', result: null === null },
                { a: null, b: undefined, op: '===', result: null === undefined },
                { a: null, b: 0, op: '===', result: null === 0 },
                { a: null, b: '0', op: '===', result: null === '0' },
                { a: 3, b: 3, op: '===', result: 3 === 3 },
                { a: 3, b: '3', op: '===', result: 3 === '3' },
                { a: '3', b: 3, op: '==', result: '3' == 3 },
            ];
            
            log('typeAnalysis', '// 資料類型比較測試');
            testCases.forEach(test => {
                log('typeAnalysis', `${JSON.stringify(test.a)} ${test.op} ${JSON.stringify(test.b)} = ${test.result}`);
            });
            
            // 測試實際資料
            log('typeAnalysis', '\n// 實際資料測試');
            const depTest = dbData.find(d => d.name === 'DEP_TEST');
            log('typeAnalysis', `DEP_TEST.parent_id = ${JSON.stringify(depTest.parent_id)} (type: ${typeof depTest.parent_id})`);
            
            // 測試不同的 parent_id 值
            const testParentIds = [null, 3, '3', undefined];
            testParentIds.forEach(pid => {
                const matches = dbData.filter(d => d.parent_id === pid);
                log('typeAnalysis', `parent_id === ${JSON.stringify(pid)} 找到 ${matches.length} 個結果`);
            });
        }

        function testFullFlow() {
            clearAll();
            
            // 模擬 API 回傳的資料（可能是字串）
            const apiData = dbData.map(d => ({
                ...d,
                id: parseInt(d.id),
                parent_id: d.parent_id ? parseInt(d.parent_id) : null
            }));
            
            log('dbData', '// 模擬 API 資料（確保類型正確）');
            log('dbData', JSON.stringify(apiData, null, 2));
            
            // 使用修正後的 buildTree
            function buildTreeFixed(items, parentId = null) {
                return items
                    .filter(item => {
                        // 確保比較時類型一致
                        if (parentId === null) {
                            return item.parent_id === null || item.parent_id === undefined;
                        }
                        return item.parent_id === parentId;
                    })
                    .map(item => ({
                        ...item,
                        children: buildTreeFixed(items, item.id)
                    }));
            }
            
            const tree = buildTreeFixed(apiData);
            
            log('finalTree', '<h3>修正後的樹狀結構：</h3>', true);
            renderTree(tree, 'finalTree');
            
            // 驗證結果
            const hasDepTest = JSON.stringify(tree).includes('DEP_TEST');
            if (hasDepTest) {
                log('diagnosis', '<div class="success">✅ DEP_TEST 成功顯示在樹狀結構中！</div>', true);
            } else {
                log('diagnosis', '<div class="error">❌ DEP_TEST 沒有出現在樹狀結構中</div>', true);
            }
        }

        function renderTree(nodes, elementId, level = 0) {
            nodes.forEach(node => {
                const nodeClass = level > 0 ? 'tree-node child-node' : 'tree-node';
                const nodeHtml = `<div class="${nodeClass}" style="margin-left: ${level * 30}px">
                    📁 ${node.name} (id=${node.id}, parent_id=${node.parent_id})
                </div>`;
                document.getElementById(elementId).innerHTML += nodeHtml;
                
                if (node.children && node.children.length > 0) {
                    renderTree(node.children, elementId, level + 1);
                }
            });
        }

        // 初始載入
        window.onload = function() {
            testDatabaseData();
        };
    </script>
</body>
</html>
