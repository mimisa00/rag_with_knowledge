<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchableSelect 測試頁面</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="frontend/static/css/core/all.min.css">
    <link rel="stylesheet" href="frontend/static/css/themes/theme-variables.css">
    <link rel="stylesheet" href="frontend/static/css/core/base.css">
    <link rel="stylesheet" href="frontend/static/css/core/components.css">
    <link rel="stylesheet" href="frontend/static/css/components/searchable-select.css">
    
    <style>
        body {
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .test-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }
        .test-modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }
        .btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-primary {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>SearchableSelect 元件測試</h1>
        
        <div class="form-group">
            <label class="form-label">一般選擇器（原生）</label>
            <select class="form-control" id="normalSelect">
                <option value="">請選擇部門</option>
                <option value="1">總經理室</option>
                <option value="2">技術部</option>
                <option value="3">前端組</option>
                <option value="4">後端組</option>
                <option value="5">業務部</option>
                <option value="6">人資部</option>
                <option value="7">財務部</option>
                <option value="8">行銷部</option>
                <option value="9">客服部</option>
                <option value="10">研發部</option>
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label">可搜尋選擇器</label>
            <select class="form-control searchable-select" id="searchableSelect"
                    data-placeholder="請選擇部門..."
                    data-search-placeholder="搜尋部門名稱..."
                    data-no-results="找不到符合的部門">
                <option value="">請選擇部門</option>
                <option value="1">總經理室</option>
                <option value="2">技術部</option>
                <option value="3">前端組</option>
                <option value="4">後端組</option>
                <option value="5">業務部</option>
                <option value="6">人資部</option>
                <option value="7">財務部</option>
                <option value="8">行銷部</option>
                <option value="9">客服部</option>
                <option value="10">研發部</option>
                <option value="11">設計部</option>
                <option value="12">品管部</option>
                <option value="13">採購部</option>
                <option value="14">法務部</option>
                <option value="15">公關部</option>
                <option value="16">企劃部</option>
                <option value="17">稽核部</option>
                <option value="18">總務部</option>
                <option value="19">資訊部</option>
                <option value="20">安全部</option>
            </select>
        </div>
        
        <div class="form-group">
            <button class="btn btn-primary" onclick="showModal()">在模態框中測試</button>
            <button class="btn" onclick="getValues()">獲取選中值</button>
            <button class="btn" onclick="addMoreOptions()">動態新增選項</button>
        </div>
        
        <div id="result" style="margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 4px; display: none;"></div>
    </div>
    
    <!-- 測試模態框 -->
    <div id="testModal" class="test-modal modal">
        <div class="modal-content">
            <button class="modal-close" onclick="hideModal()">&times;</button>
            <h3>模態框中的選擇器</h3>
            <div class="form-group">
                <label class="form-label">在模態框中的可搜尋選擇器</label>
                <select class="form-control searchable-select" id="modalSelect"
                        data-placeholder="請選擇部門..."
                        data-search-placeholder="搜尋部門名稱..."
                        data-no-results="找不到符合的部門">
                    <option value="">請選擇部門</option>
                    <option value="1">總經理室</option>
                    <option value="2">技術部</option>
                    <option value="3">前端組</option>
                    <option value="4">後端組</option>
                    <option value="5">業務部</option>
                    <option value="6">人資部</option>
                    <option value="7">財務部</option>
                    <option value="8">行銷部</option>
                    <option value="9">客服部</option>
                    <option value="10">研發部</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="hideModal()">關閉</button>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="frontend/static/js/components/searchable-select.js"></script>
    
    <script>
        function showModal() {
            document.getElementById('testModal').classList.add('show');
            // 確保模態框中的選擇器也被初始化
            initSearchableSelects('#testModal .searchable-select');
        }
        
        function hideModal() {
            document.getElementById('testModal').classList.remove('show');
        }
        
        function getValues() {
            const normalValue = document.getElementById('normalSelect').value;
            const searchableValue = document.getElementById('searchableSelect').value;
            const modalValue = document.getElementById('modalSelect').value;
            
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.innerHTML = `
                <h4>選中的值：</h4>
                <p><strong>一般選擇器：</strong> ${normalValue || '未選擇'}</p>
                <p><strong>可搜尋選擇器：</strong> ${searchableValue || '未選擇'}</p>
                <p><strong>模態框選擇器：</strong> ${modalValue || '未選擇'}</p>
            `;
        }
        
        function addMoreOptions() {
            const selects = ['searchableSelect', 'modalSelect'];
            const newOptions = [
                { value: '11', text: '設計部' },
                { value: '12', text: '品管部' },
                { value: '13', text: '採購部' },
                { value: '14', text: '法務部' },
                { value: '15', text: '公關部' }
            ];
            
            selects.forEach(selectId => {
                const select = document.getElementById(selectId);
                newOptions.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt.value;
                    option.textContent = opt.text;
                    select.appendChild(option);
                });
                
                // 重新載入 SearchableSelect
                if (select.searchableSelectInstance) {
                    select.searchableSelectInstance.reload();
                }
            });
            
            alert('已新增更多選項！');
        }
        
        // 監聽選擇變化
        document.addEventListener('change', function(e) {
            if (e.target.classList.contains('searchable-select') || e.target.id === 'normalSelect') {
                console.log(`${e.target.id} 選中值改變:`, e.target.value);
            }
        });
        
        // 點擊模態框外部關閉
        document.getElementById('testModal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideModal();
            }
        });
    </script>
</body>
</html>
