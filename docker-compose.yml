  backend:
    #build: ./backend
    image: rag_with_ollama-backend:latest
    container_name: backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - TZ=${TZ}
      - OLLAMA_API_HOST=${OLLAMA_API_HOST}
      - HF_HOME=${HF_HOME}
      - LOG_LEVEL=${LOG_LEVEL}
      - DEBUG=${DEBUG}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials/vertex-ai-key.json
    depends_on:
      - ollama
      - mariadb
    volumes:
      - ./app:/backend/app
      - ./config:/etc/backend
      - ./documents:/backend/documents
      - ./faiss_data:${FAISS_DIR}
      - ./frontend:/backend/frontend
      - ./models:${HF_HOME}
      - ./logs:/backend/logs
      - .env:/backend/.env
      - ./credentials/vertex-ai-key.json:/credentials/vertex-ai-key.json:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "5"
    # mark deploy release gpu source, because embedding parser text to used gpu 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NVIDIA_GPU_COUNT}
              capabilities: [gpu]
